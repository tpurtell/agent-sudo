[workspace]
resolver = "3"
members = ["protocol", "hostd", "service"]
# The sudo-rs fork keeps its own lockfile and release profile, exactly as upstream.
exclude = ["sudo"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tpurtell/agent-sudo"
rust-version = "1.88"

[workspace.dependencies]
agent-sudo-protocol = { path = "protocol" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["std"] }
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
