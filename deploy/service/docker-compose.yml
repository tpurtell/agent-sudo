# agent-sudo approval service.
#
#   docker compose --profile tailscale up -d   # HTTPS on your tailnet via `tailscale serve`
#   docker compose --profile nginx up -d       # HTTPS with your own certificate
#
# Both profiles run the same service container; only the front door differs.
name: agent-sudo

services:
  service:
    image: ${AGENT_SUDO_IMAGE:-agent-sudo-service:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./service.toml:/etc/agent-sudo/service.toml:ro
      - data:/data
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Tailscale sidecar: joins your tailnet as $TS_HOSTNAME and serves the service on
  # https://$TS_HOSTNAME.<tailnet>.ts.net with an automatic Let's Encrypt certificate.
  # Only tailnet devices can reach it. Requires MagicDNS and HTTPS certificates to be
  # enabled in the tailnet admin console. Without TS_AUTHKEY it prints a login link
  # to approve once; its identity then persists in the `tailscale` volume.
  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-agent-sudo}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-agent-sudo}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on: [service]
    logging: *logging

  nginx:
    profiles: [nginx]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT:-./certs/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY:-./certs/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on: [service]
    logging: *logging

volumes:
  data:
  tailscale:
