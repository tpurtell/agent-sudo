# End-to-end environment. Run through ./run.sh, which creates the test CA first.
name: agent-sudo-e2e

services:
  service:
    image: agent-sudo-service:e2e
    volumes:
      - ./config/service.toml:/etc/agent-sudo/service.toml:ro
    environment:
      AGENT_SUDO_SETUP_TOKEN: e2e-setup-token-0123456789
      RUST_LOG: agent_sudo_service=info,audit=info
    tmpfs: [/data:uid=10001]

  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.work/certs:/certs:ro
    depends_on: [service]
    networks:
      default:
        aliases: [sudo.e2e.test]

  mock-llm:
    image: python:3.12-alpine
    command: ["python3", "/srv/server.py"]
    volumes: ["./mock-llm/server.py:/srv/server.py:ro"]

  host:
    image: agent-sudo-host:e2e
    hostname: e2e-host
    volumes: ["./.work/certs/ca.pem:/certs/ca.pem:ro"]
    depends_on: [proxy]

  runner:
    image: agent-sudo-runner:e2e
    working_dir: /e2e
    volumes:
      - ./:/e2e
      - /e2e/node_modules
    environment:
      BASE_URL: https://sudo.e2e.test
      HOST_RUNNER: http://host:9000
      CI: "1"
    depends_on: [proxy, host, mock-llm]
    command: ["sleep", "infinity"]
